name: Lua Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  busted:
    name: Run busted specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the readline headers Lua builds against and the locales package
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev locales

      - name: Provision the comma-decimal locale the specs switch to
        run: sudo locale-gen ru_RU.UTF-8

      - name: Set up mise with the Lua Lightroom runs
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: lua
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore the Lua rocks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lua_modules
          key: lua-modules-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('.mise.toml') }}

      - name: Run busted
        run: mise run lua:test
