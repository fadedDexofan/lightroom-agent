name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .mise.toml
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Release script tests
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          test -f scripts/bump-version.test.mjs
          test -f scripts/codex-package.test.mjs
          test -f scripts/package-contents.test.mjs
          test -f scripts/release.test.mjs
          node --test "scripts/*.test.mjs"

      - name: Generated files are up to date
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: |
          git diff --exit-code -- plugin/LightroomAgent.lrplugin/Contract.lua mcpb/manifest.json server/src/skill-content.ts codex/skills
          test -z "$(git ls-files --others --exclude-standard -- codex/skills)"

      - name: Live kit scripts parse
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: for f in tests/e2e/live/*.mjs tests/e2e/live/lib/*.mjs; do node --check "$f"; done

      - name: Test
        timeout-minutes: 5
        run: npm run test:coverage -- --ci --reporters=default

      - name: Live kit tests
        if: matrix.os != 'windows-latest'
        working-directory: .
        run: node --test "tests/e2e/live/unit/*.test.mjs"

      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-dist
          path: server/dist
          retention-days: 7

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .mise.toml

      - name: Assert all version sources agree
        run: node scripts/bump-version.mjs --check
