[tools]
node = "26.13.1"
lua = "5.1.5"
# selene (Rust) and luacheck (a rock in lua_modules/ on the Lua above) lint the
# plug-in and its specs, and StyLua checks the plug-in's formatting — see lua:lint.
"aqua:Kampfkarren/selene" = "0.32.0"
"aqua:JohnnyMorganz/StyLua" = "2.6.0"

[env]
# Project-local LuaRocks tree (busted, luacheck) installed by `lua:deps`.
_.path = ["lua_modules/bin"]

[tasks.install]
description = "Install dependencies"
run = "cd server && npm install"

[tasks.build]
description = "Build TypeScript MCP server"
run = "cd server && npm run build"

[tasks.test]
description = "Run tests"
run = "cd server && npm test"

[tasks.format]
description = "Format the TypeScript, JavaScript and plug-in Lua"
run = ["npm --prefix server run format", "stylua plugin"]

[tasks."format:check"]
description = "Check the formatting of the TypeScript, JavaScript and plug-in Lua"
run = ["npm --prefix server run format:check", "stylua --check plugin"]

[tasks.dev]
description = "Build in watch mode"
run = "cd server && npm run watch"

[tasks."plugin:reload"]
description = "Reload the installed Lightroom Agent plug-in on macOS"
run = "osascript tests/e2e/reload-plugin.applescript"

[tasks.mcpb]
description = "Build the .mcpb bundle for Claude Desktop / Claude Code"
depends = ["build"]
run = "node scripts/build-mcpb.mjs"

[tasks."lua:deps"]
description = "Install the pinned Lua rocks (busted, luacheck) into lua_modules/"
run = [
  "test -d lua_modules/lib/luarocks/rocks-$(luarocks config lua_version)/busted/2.3.0-1 || luarocks install --tree lua_modules busted 2.3.0-1",
  "test -d lua_modules/lib/luarocks/rocks-$(luarocks config lua_version)/luacheck/1.2.0-1 || luarocks install --tree lua_modules luacheck 1.2.0-1",
]

[tasks."lua:test"]
description = "Run busted specs for the Lightroom plugin"
depends = ["lua:deps"]
run = "lua_modules/bin/busted"

[tasks."lua:lint"]
description = "Lint the Lightroom plugin and its specs with selene and luacheck, and check its formatting with StyLua"
depends = ["lua:deps"]
run = [
  "selene plugin/LightroomAgent.lrplugin",
  "selene --config selene-spec.toml plugin/spec",
  "lua_modules/bin/luacheck plugin",
  "stylua --check plugin",
]

[tasks."live:fixtures"]
description = "Generate the live-test fixtures, download the CC0 raw samples and verify both"
run = [
  "node tests/e2e/live/generate-fixtures.mjs",
  "node tests/e2e/live/fetch-samples.mjs",
  "node tests/e2e/live/verify-fixtures.mjs",
]

[tasks."live:test"]
description = "Run the unit tests of the live-test kit (no Lightroom needed)"
run = "node --test \"tests/e2e/live/unit/*.test.mjs\""

[tasks."live:setup"]
description = "Create a throwaway Lightroom catalog and import the live-test fixtures (macOS)"
run = "node tests/e2e/live/setup-catalog.mjs"
